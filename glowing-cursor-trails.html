<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSOMNIA</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080510;
        cursor: none;
    }

    #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .center {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        pointer-events: none;
    }

    h1 {
        color: #ffffff;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(4rem, 12vw, 11rem);
        font-weight: 400;
        letter-spacing: 0.18em;
        padding-left: 0.18em;
        text-shadow:
            0 0 12px rgba(255,255,255,.9),
            0 0 30px rgba(180,90,255,.75),
            0 0 70px rgba(120,30,255,.45);
        user-select: none;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="center">
    <h1>INSOMNIA</h1>
</div>

<script>
(() => {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const target = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
    };

    const settings = {
        friction: 0.5,
        trails: 20,
        size: 50,
        dampening: 0.25,
        tension: 0.98
    };

    let tendrils = [];
    let huePhase = Math.random() * Math.PI * 2;

    class Node {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
        }
    }

    class Tendril {
        constructor(spring) {
            this.spring = spring + Math.random() * 0.1 - 0.05;
            this.friction = settings.friction + Math.random() * 0.01 - 0.005;
            this.nodes = [];

            for (let i = 0; i < settings.size; i++) {
                this.nodes.push(new Node(target.x, target.y));
            }
        }

        update() {
            let spring = this.spring;
            let node = this.nodes[0];

            node.vx += (target.x - node.x) * spring;
            node.vy += (target.y - node.y) * spring;

            for (let i = 0; i < this.nodes.length; i++) {
                node = this.nodes[i];

                if (i > 0) {
                    const prev = this.nodes[i - 1];

                    node.vx += (prev.x - node.x) * spring;
                    node.vy += (prev.y - node.y) * spring;

                    node.vx += prev.vx * settings.dampening;
                    node.vy += prev.vy * settings.dampening;
                }

                node.vx *= this.friction;
                node.vy *= this.friction;

                node.x += node.vx;
                node.y += node.vy;

                spring *= settings.tension;
            }
        }

        draw() {
            let x = this.nodes[0].x;
            let y = this.nodes[0].y;

            ctx.beginPath();
            ctx.moveTo(x, y);

            for (let i = 1; i < this.nodes.length - 2; i++) {
                const a = this.nodes[i];
                const b = this.nodes[i + 1];

                x = (a.x + b.x) * 0.5;
                y = (a.y + b.y) * 0.5;

                ctx.quadraticCurveTo(a.x, a.y, x, y);
            }

            const a = this.nodes[this.nodes.length - 2];
            const b = this.nodes[this.nodes.length - 1];

            ctx.quadraticCurveTo(a.x, a.y, b.x, b.y);
            ctx.stroke();
        }
    }

    function reset() {
        tendrils = [];

        for (let i = 0; i < settings.trails; i++) {
            tendrils.push(
                new Tendril(0.45 + 0.025 * (i / settings.trails))
            );
        }
    }

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function updateTarget(x, y) {
        target.x = x;
        target.y = y;
    }

    window.addEventListener("mousemove", e => {
        updateTarget(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener("touchmove", e => {
        if (e.touches.length) {
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    window.addEventListener("touchstart", e => {
        if (e.touches.length) {
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    window.addEventListener("resize", () => {
        resize();
        reset();
    });

    function animate() {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(8, 5, 16, 0.40)";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        huePhase += 0.0015;
        const hue = 285 + Math.sin(huePhase) * 85;

        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = `hsla(${Math.round(hue)}, 90%, 50%, 0.25)`;
        ctx.lineWidth = 1;

        for (const tendril of tendrils) {
            tendril.update();
            tendril.draw();
        }

        requestAnimationFrame(animate);
    }

    resize();
    reset();
    animate();
})();
</script>

</body>
</html>
